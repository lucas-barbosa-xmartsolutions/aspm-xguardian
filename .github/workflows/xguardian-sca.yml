name: XGuardian — IQ Scan + SCA Ingest

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  iq-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Sonatype IQ CLI
        run: |
          curl -s -L -o nexus-iq-cli.jar \
            "https://download.sonatype.com/clm/scanner/nexus-iq-cli-2.9.0-01.jar"

      - name: Executar scan no IQ Server
        id: iq_scan
        run: |
          OUTPUT=$(java -jar nexus-iq-cli.jar \
            -a "${{ secrets.IQ_USER_TOKEN_CODE }}:${{ secrets.IQ_USER_TOKEN_PASS }}" \
            -i "fake-python-app" \
            -s "${{ vars.IQ_SERVER_URL }}" \
            -t build \
            . 2>&1) || true

          echo "$OUTPUT"

          REPORT_ID=$(echo "$OUTPUT" | grep -oP '/report/\K[a-zA-Z0-9]+' | head -1 || true)

          if [ -z "$REPORT_ID" ]; then
            echo "::error::Report ID não encontrado no output do IQ Server"
            exit 1
          fi

          echo "report_id=$REPORT_ID" >> "$GITHUB_OUTPUT"

      - name: Baixar CycloneDX do IQ Server
        run: |
          IQ_URL="${{ vars.IQ_SERVER_URL }}"
          IQ_URL="${IQ_URL%/}"

          APPS_RESPONSE=$(curl -s \
            -u "${{ secrets.IQ_USER_TOKEN_CODE }}:${{ secrets.IQ_USER_TOKEN_PASS }}" \
            "${IQ_URL}/api/v2/applications?publicId=fake-python-app")

          echo "Resposta da API de aplicações:"
          echo "${APPS_RESPONSE}"

          APP_INTERNAL_ID=$(echo "${APPS_RESPONSE}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['applications'][0]['id'])")

          echo "APP_INTERNAL_ID: ${APP_INTERNAL_ID}"

          curl -s \
            -u "${{ secrets.IQ_USER_TOKEN_CODE }}:${{ secrets.IQ_USER_TOKEN_PASS }}" \
            -H "Accept: application/json" \
            "${IQ_URL}/api/v2/cycloneDx/1.4/${APP_INTERNAL_ID}/stages/build" \
            -o iq-cyclonedx.json

          echo "Componentes no CycloneDX:"
          python3 -c "import json; d=json.load(open('iq-cyclonedx.json')); print(len(d.get('components',[])), 'components,', len(d.get('vulnerabilities',[])), 'vulnerabilities')"

      - name: Upload CycloneDX como artifact
        uses: actions/upload-artifact@v4
        with:
          name: iq-cyclonedx-report
          path: iq-cyclonedx.json

  xguardian-ingest:
    needs: iq-scan
    runs-on: ubuntu-latest

    steps:
      - name: Download CycloneDX
        uses: actions/download-artifact@v4
        with:
          name: iq-cyclonedx-report

      - name: Enviar para XGuardian
        uses: xguardian-actions/actions/sonatype-iq@development
        with:
          token: ${{ secrets.XGUARDIAN_TOKEN }}
          report: iq-cyclonedx.json
          is_development: "true"
          triggered_by: ${{ github.actor }}
